name: Surveillance Mégane

# Tourne sur les serveurs de GitHub : aucune machine à laisser allumée.
#
# Deux passages par heure, à 23 et 53. L'heure est en UTC.
#
# Les minutes sont choisies, pas arbitraires. GitHub exécute les tâches
# planifiées « au mieux » : en période de charge il les retarde, puis les
# abandonne purement et simplement. Le début d'heure est le pic mondial — c'est
# là que tout le monde planifie — et les dépôts gratuits y passent en dernier.
# Un cron à "7 * * * *" a été sauté 4 fois de suite le 27/08/2026, le seul
# passage abouti ayant démarré avec 21 minutes de retard.
#
# D'où les deux corrections : des minutes loin du pic, et deux créneaux plutôt
# qu'un, pour qu'un créneau perdu coûte 30 minutes et non une heure. Chaque
# passage consomme environ une minute sur les 2000 gratuites mensuelles.
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la demande

# Deux exécutions simultanées se marcheraient dessus en réécrivant l'état.
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # nécessaire pour recommitter l'état

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Chercher les nouvelles annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py

      # Inventaire complet du jour, téléchargeable depuis la page du run.
      - name: Publier l'inventaire
        uses: actions/upload-artifact@v4
        with:
          name: annonces
          path: data/annonces.csv
          retention-days: 7

      # L'état mémorise les annonces déjà vues. Sans cette étape, chaque
      # exécution repartirait de zéro et ne détecterait jamais de nouveauté.
      - name: Mémoriser les annonces vues
        run: |
          if [ ! -f data/state.json ]; then
            echo "::error::Aucun état produit : le passage précédent n'a rien récupéré."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          # historique.csv n'existe que dès qu'un premier événement a eu lieu
          if [ -f data/historique.csv ]; then git add data/historique.csv; fi
          if git diff --quiet --cached; then
            echo "aucun changement à enregistrer"
            exit 0
          fi
          git commit -m "surveillance : $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Deux passages rapproches partent du meme commit : le second se
          # retrouve perime au moment de pousser, et un `pull --rebase` bute
          # alors sur un conflit que personne n'est la pour resoudre. Or ces
          # deux fichiers se fusionnent sans ambiguite :
          #   - state.json est un instantane, le plus recent fait foi ;
          #   - historique.csv est un journal, on garde les lignes des deux.
          for tentative in 1 2 3; do
            if git push; then exit 0; fi
            echo "::notice::Le depot a bouge, fusion et nouvel essai ($tentative/3)"
            git fetch origin main
            git show origin/main:data/historique.csv > /tmp/journal-distant.csv 2>/dev/null || true
            if ! git rebase --strategy-option=theirs origin/main; then
              git rebase --abort
              echo "::error::Rebase impossible, etat non enregistre."
              exit 1
            fi
            # Le rebase a garde notre journal : on y reinjecte les lignes de
            # l'autre passage. L'horodatage ISO ouvre chaque ligne, donc le tri
            # alphabetique remet l'ensemble dans l'ordre chronologique.
            if [ -s /tmp/journal-distant.csv ] && [ -f data/historique.csv ]; then
              {
                head -1 data/historique.csv
                { tail -n +2 /tmp/journal-distant.csv; tail -n +2 data/historique.csv; } | sort -u
              } > /tmp/journal-fusionne.csv
              mv /tmp/journal-fusionne.csv data/historique.csv
              git add data/historique.csv
              git commit --amend --no-edit
            fi
          done
          echo "::error::Push impossible apres 3 tentatives."
          exit 1
