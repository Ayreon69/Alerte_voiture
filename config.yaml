# ---------------------------------------------------------------------------
# Alerte Mégane E-Tech EV60 — critères de recherche
# Modifie ce fichier puis relance : python run.py
# ---------------------------------------------------------------------------

recherche:
  # Sites interrogés, par ordre de richesse des données. Quand la même voiture
  # est publiée sur plusieurs sites, c'est l'annonce la MOINS CHÈRE qui est
  # retenue, à condition d'être moins chère de plus de 100 € ; en deçà, c'est
  # le premier site de cette liste qui l'emporte. Les caractéristiques du
  # véhicule absentes de l'annonce retenue sont complétées par les autres, si
  # bien qu'on garde le meilleur prix sans perdre l'état de santé batterie.
  # D'où l'ordre : renew.auto en tête car lui seul publie ce SoH, leboncoin en
  # queue car il ne publie pas la plaque.
  # Retirer un nom de la liste désactive le site.
  # leboncoin est retire tant que la surveillance tourne sur GitHub Actions :
  # le site refuse les IP de datacenter (403 immediat) et ne repond qu'aux IP
  # residentielles. Le remettre dans la liste des que le bot tourne depuis une
  # machine derriere une box -- il fonctionne parfaitement de la.
  sources: [renew, autoscout24]

  # Modèle ciblé sur renew.auto (valeurs exactes de l'API)
  marque: RENAULT
  modele: MEGANE E-TECH ELECTRIQUE

  # Nom court du modèle, pour les sites qui indexent "megane" tout court
  # (AutoScout24). Par défaut : le premier mot de `modele`.
  modele_court: megane

  # Plateforme de publication. NATIONAL = annonces visibles sur fr.renew.auto.
  # Ne pas changer sans raison : les autres valeurs remontent des vehicules
  # dont la fiche n'existe pas sur le site (page 410).
  plateforme: NATIONAL

  # Batterie : 60 = EV60, 40 = EV40, null = les deux
  batterie_kwh: 60

  # Année de 1re mise en circulation minimum (incluse)
  annee_min: 2023
  annee_max: null

  # Filtres optionnels — laisse null pour ne pas filtrer
  prix_max: null            # ex: 22000
  prix_min: null
  km_max: null              # ex: 60000
  soh_min: null             # état de santé batterie en %, ex: 92
  departements: null        # ex: [75, 77, 78, 91, 92, 93, 94, 95]
  exclure_reserves: false   # true = ignorer les véhicules déjà réservés

alertes:
  # Notifier une baisse de prix sur une annonce déjà connue
  baisses_de_prix: true
  # Seuil minimum (en €) pour notifier une baisse
  baisse_min_eur: 200
  # Notifier quand une annonce disparaît (vendue / retirée)
  annonces_disparues: false
  # Nombre max d'annonces détaillées envoyées par exécution
  # (au-delà, un simple résumé est envoyé — évite le spam au premier run)
  max_notifications: 20

execution:
  # Intervalle par défaut du mode --watch, en minutes
  intervalle_minutes: 30
  # Pause entre deux pages d'API (politesse)
  delai_entre_pages_s: 1.0
